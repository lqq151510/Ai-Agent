apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: my-registry/ai-agent-backend:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/ai_agent"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: SECURITY_DB_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECURITY_DB_ENCRYPTION_KEY
        - name: SECURITY_DB_LEGACY_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECURITY_DB_LEGACY_ENCRYPTION_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: OPENAI_API_KEY
        - name: BUG_SENTINEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: BUG_SENTINEL_TOKEN
              optional: true
        - name: BUG_SENTINEL_OWNER_USER_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: BUG_SENTINEL_OWNER_USER_ID
              optional: true
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/system/health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
