# ============================================================================
# AI Agent Desktop - electron-builder 配置
# ----------------------------------------------------------------------------
# 说明：
# - 输出目录使用 `release`（而非 `dist`），因为 `dist/` 下存放 tsc 编译
#   产物（dist/main、dist/renderer），若将 electron-builder 输出设为 dist
#   会在打包时清空该目录，导致编译产物丢失。`release/` 为独立目录，安全。
# - 默认 `build-all.sh` 输出仅用于开发诊断；正式 macOS 发行必须通过
#   `scripts/release-check-macos.sh`，它强制签名、公证与交付物验证。
# - 图标文件位于 resources/icons/codejoy-icon.*。
# ============================================================================

appId: com.agent.aiagent
productName: AI Agent
copyright: Copyright 2025 AI Agent

directories:
  output: release
  buildResources: resources

# 打包进 asar 的文件：编译产物 + 渲染层 + 资源 + 生产依赖
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/**/{*.md,*.markdown,*.ts,*.flow,*.coffee,*. yarn*}"
  - "!node_modules/**/{test,tests,__tests__,docs,doc,examples,example}/**"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/.*"

# extraResources：不打入 asar，运行时通过 process.resourcesPath 访问
# 后端 JAR、JRE、TS CLI 均放在 backend-jre/ 目录下
extraResources:
  - from: backend-jre
    to: backend-jre
    filter:
      - "**/*"
      - "!**/.git"

asar: true
asarUnpack:
  - "**/*.{node,dylib,so,dll}"
npmRebuild: false

# ---------------------------------------------------------------------------
# macOS 配置（首要目标：Apple Silicon / Intel）
# ---------------------------------------------------------------------------
mac:
  # npm prerelease labels are not valid Apple bundle version values. Keep the
  # user-facing prerelease in package.json while emitting numeric metadata.
  bundleShortVersion: "0.1.0"
  bundleVersion: "1"
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: resources/icons/codejoy-icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # 正式发行由 scripts/release-check-macos.sh 强制签名与公证；
  # 凭据只从 APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID 读取。
  # electron-builder 26.x 的 notarize 配置是布尔值。
  notarize: true
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  # 扩展信息：注册到系统（可选）
  extendInfo:
    NSMicrophoneUsageDescription: "AI Agent 需要麦克风权限以支持语音输入功能。"
    NSCameraUsageDescription: "AI Agent 需要摄像头权限以支持图像识别功能。"

dmg:
  title: "${productName} ${version}"
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------------------------------------------------------------------------
# Windows 配置
# ---------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/codejoy-icon.ico
  artifactName: "${productName}-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "AI Agent"
  perMachine: false
  deleteAppDataOnUninstall: false

# ---------------------------------------------------------------------------
# Linux 配置
# ---------------------------------------------------------------------------
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icons/codejoy-icon.png
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  maintainer: "AI Agent Team"
  vendor: "AI Agent"
  synopsis: "AI Agent Desktop Client"
  description: "AI Agent 桌面客户端，集成后端服务与前端界面。"

appImage:
  artifactName: "${productName}-${version}-${arch}.AppImage"

deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3

# ---------------------------------------------------------------------------
# 发布配置：暂不自动发布
# ---------------------------------------------------------------------------
publish: null
