name: ai-agent-beta

include:
  - milvus-dc.yml

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    command:
      - sh
      - -c
      - |
        if [ -n "${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"${REDIS_PASSWORD}\" ping; else redis-cli ping; fi | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.5
    container_name: ai-agent-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE_REPO:-ai-agent-backend}:${APP_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-agent-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${POSTGRES_DB:-ai_agent}
      PG_USERNAME: ${POSTGRES_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-OPENAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://10.115.10.220:1234/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen/qwen3.5-9b}
      MARKITDOWN_URL: ${MARKITDOWN_URL:-http://python-service:8000/parse}
      PYTHON_SERVICE_BASE_URL: ${PYTHON_SERVICE_BASE_URL:-http://python-service:8000}
      PYTHON_SERVICE_ENABLED: ${PYTHON_SERVICE_ENABLED:-true}
      PYTHON_SERVICE_CONNECT_TIMEOUT_MS: ${PYTHON_SERVICE_CONNECT_TIMEOUT_MS:-3000}
      PYTHON_SERVICE_READ_TIMEOUT_MS: ${PYTHON_SERVICE_READ_TIMEOUT_MS:-30000}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/app/workspace}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://127.0.0.1:5173}
      MODEL_CONNECT_TIMEOUT_MS: ${MODEL_CONNECT_TIMEOUT_MS:-5000}
      MODEL_READ_TIMEOUT_MS: ${MODEL_READ_TIMEOUT_MS:-45000}
      MODEL_TOTAL_TIMEOUT_MS: ${MODEL_TOTAL_TIMEOUT_MS:-300000}
      MODEL_IDEMPOTENT_RETRIES: ${MODEL_IDEMPOTENT_RETRIES:-1}
      CHAT_RATE_LIMIT_PER_MIN: ${CHAT_RATE_LIMIT_PER_MIN:-60}
      CHAT_PREMIUM_RATE_LIMIT_PER_MIN: ${CHAT_PREMIUM_RATE_LIMIT_PER_MIN:-120}
      LOGIN_RATE_LIMIT_PER_MIN: ${LOGIN_RATE_LIMIT_PER_MIN:-20}
      REGISTER_RATE_LIMIT_PER_MIN: ${REGISTER_RATE_LIMIT_PER_MIN:-10}
      REFRESH_RATE_LIMIT_PER_MIN: ${REFRESH_RATE_LIMIT_PER_MIN:-60}
      STARTUP_VALIDATION_FAIL_FAST: ${STARTUP_VALIDATION_FAIL_FAST:-false}
      MODEL_PROBE_TIMEOUT_MS: ${MODEL_PROBE_TIMEOUT_MS:-3000}
      MODEL_PROBE_RETRIES: ${MODEL_PROBE_RETRIES:-1}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./workspace:/app/workspace
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/system/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 512M



  python-service:
    container_name: python-service
    build:
      context: ./python-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PYTHON_SERVICE_PORT:-8000}:8000"
    environment:
      PYTHON_SERVICE_CORS_ORIGINS: ${PYTHON_SERVICE_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M

  # ========== 监控栈 ==========

  # Prometheus - 指标采集与存储
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: ai-agent-prometheus
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  # Grafana - 指标可视化仪表盘
  grafana:
    image: grafana/grafana:11.3.0
    container_name: ai-agent-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  # Node Exporter - 主机级指标采集（CPU/内存/磁盘/网络）
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ai-agent-node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          memory: 32M

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
