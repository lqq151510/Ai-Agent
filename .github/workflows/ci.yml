name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Compose and Kubernetes deployment configuration
        run: |
          set -euo pipefail
          docker compose --env-file env/dev.env.example -f docker-compose.yml config --quiet
          python3 - <<'PY'
          from pathlib import Path

          backend = Path("k8s/backend-deployment.yaml").read_text()
          dockerfile = Path("backend/Dockerfile").read_text()
          local_script = Path("start-local.sh").read_text()
          kafka_config = Path("backend/src/main/java/com/agent/mvp/core/agent/config/KafkaTopicConfig.java").read_text()
          postgres = Path("k8s/postgres-statefulset.yaml").read_text()
          configmap = Path("k8s/configmap.yaml").read_text()
          service = Path("k8s/backend-service.yaml").read_text()
          assert 'required=true' in dockerfile
          assert '/run/secrets/maven_settings' in dockerfile
          assert 'id=github_actor,env=GITHUB_ACTOR' in dockerfile
          assert 'id=github_token,env=GITHUB_TOKEN' in dockerfile
          deploy = Path("scripts/deploy.sh").read_text()
          assert 'MAVEN_SETTINGS_FILE must point to an existing Maven settings file' in deploy
          assert '--secret "id=maven_settings,src=${MAVEN_SETTINGS_FILE}"' in deploy
          assert '--secret "id=github_actor,env=GITHUB_ACTOR"' in deploy
          assert '--secret "id=github_token,env=GITHUB_TOKEN"' in deploy
          assert 'prometheus.io/scrape' not in backend
          assert 'prometheus.io/port' not in backend
          assert 'prometheus.io/path' not in backend
          assert 'path: /actuator/health/liveness' in backend
          assert 'path: /api/v1/system/health/ready' in backend
          assert '@Profile("mq")' in kafka_config
          assert 'KAFKA_BOOTSTRAP_SERVERS' not in configmap
          assert 'eval' not in local_script
          assert 'redis-cli -a' not in local_script
          assert 'key: POSTGRES_PASSWORD' in backend
          assert 'key: JWT_SECRET' in backend
          assert 'key: SECURITY_DB_ENCRYPTION_KEY' in backend
          assert 'key: SECURITY_DB_LEGACY_ENCRYPTION_KEY' in backend
          assert 'key: OPENAI_API_KEY' in backend
          assert 'name: BUG_SENTINEL_TOKEN' in backend
          assert 'key: BUG_SENTINEL_TOKEN' in backend
          assert 'BUG_SENTINEL_RECEIVER_TOKEN' not in backend
          assert '@Value("${BUG_SENTINEL_TOKEN:}")' in Path("backend/src/main/java/com/agent/mvp/config/SentinelRequestFilter.java").read_text()
          assert '@Value("${BUG_SENTINEL_TOKEN:}")' in Path("bug-sentinel-starter/src/main/java/com/agent/sentinel/BugSentinelAutoConfiguration.java").read_text()
          assert 'value: "postgres"' not in backend
          assert 'value: "postgres"' not in postgres
          assert 'key: POSTGRES_PASSWORD' in postgres
          assert 'SPRING_PROFILES_ACTIVE' not in configmap
          assert 'name: http' in service
          assert 'app: backend' in service
          PY

  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/src/renderer/package-lock.json
            ts-cli/package-lock.json
            local-service/package-lock.json

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Install renderer dependencies
        working-directory: ./desktop/src/renderer
        run: npm ci

      - name: Install CLI dependencies
        working-directory: ./ts-cli
        run: npm ci

      - name: Install local-service dependencies
        working-directory: ./local-service
        run: npm ci

      - name: Run release preflight
        env:
          RELEASE_CHECK_PACKAGE_DESKTOP: 'true'
          RELEASE_CHECK_PREPARE_DESKTOP_BACKEND: 'true'
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release-check.sh dev

  python-service-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./python-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Pytest
        working-directory: ./python-service
        run: python -m pytest -p no:cacheprovider

  backend-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Spotless Code Formatting Check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --settings .mvn/settings.xml -pl backend com.diffplug.spotless:spotless-maven-plugin:2.43.0:check

      - name: JaCoCo Coverage Report
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --settings .mvn/settings.xml -pl backend -am clean test

  desktop-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Run Desktop Main Process Tests
        working-directory: ./desktop
        run: npm run test:main



  sentinel-alert:
    needs: [release-preflight, python-service-test, backend-quality, desktop-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Bug Sentinel
        run: |
          echo "Pipeline failed! Triggering Bug Sentinel for root cause analysis..."
          # Mock triggering the webhook. In production, use the real webhook URL.
          # curl -X POST -H "Content-Type: application/json" \
          #   -d '{"source": "github-actions", "symptom": "CI Pipeline failed on branch ${{ github.ref_name }}", "commit": "${{ github.sha }}"}' \
          #   ${{ secrets.SENTINEL_WEBHOOK_URL }} || echo "Sentinel hook skipped or unavailable"
