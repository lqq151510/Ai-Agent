name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/src/renderer/package-lock.json
            ts-cli/package-lock.json
            local-service/package-lock.json

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Install renderer dependencies
        working-directory: ./desktop/src/renderer
        run: npm ci

      - name: Install CLI dependencies
        working-directory: ./ts-cli
        run: npm ci

      - name: Install local-service dependencies
        working-directory: ./local-service
        run: npm ci

      - name: Run release preflight
        env:
          RELEASE_CHECK_PACKAGE_DESKTOP: 'true'
          RELEASE_CHECK_PREPARE_DESKTOP_BACKEND: 'true'
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release-check.sh dev

  python-service-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./python-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Pytest
        working-directory: ./python-service
        run: pytest

  backend-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Spotless Code Formatting Check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --settings .mvn/settings.xml -pl backend com.diffplug.spotless:spotless-maven-plugin:2.43.0:check

      - name: JaCoCo Coverage Report
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --settings .mvn/settings.xml -pl backend -am clean test jacoco:report

  desktop-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Run Desktop Main Process Tests
        working-directory: ./desktop
        run: npm run test:main



  sentinel-alert:
    needs: [release-preflight, python-service-test, backend-quality, desktop-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Bug Sentinel
        run: |
          echo "Pipeline failed! Triggering Bug Sentinel for root cause analysis..."
          # Mock triggering the webhook. In production, use the real webhook URL.
          # curl -X POST -H "Content-Type: application/json" \
          #   -d '{"source": "github-actions", "symptom": "CI Pipeline failed on branch ${{ github.ref_name }}", "commit": "${{ github.sha }}"}' \
          #   ${{ secrets.SENTINEL_WEBHOOK_URL }} || echo "Sentinel hook skipped or unavailable"
