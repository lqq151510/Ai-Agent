name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/src/renderer/package-lock.json
            ts-cli/package-lock.json
            local-service/package-lock.json

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Install renderer dependencies
        working-directory: ./desktop/src/renderer
        run: npm ci

      - name: Run release preflight
        env:
          RELEASE_CHECK_PACKAGE_DESKTOP: 'true'
          RELEASE_CHECK_PREPARE_DESKTOP_BACKEND: 'true'
        run: ./scripts/release-check.sh dev

  python-service-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./python-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Pytest
        working-directory: ./python-service
        run: pytest

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          
      - name: Spotless Code Formatting Check
        working-directory: ./backend
        run: mvn spotless:check
        
      - name: JaCoCo Coverage Report
        working-directory: ./backend
        run: mvn clean test jacoco:report
        
  desktop-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Run Desktop Main Process Tests
        working-directory: ./desktop
        run: npm run test:main



  sentinel-alert:
    needs: [release-preflight, python-service-test, backend-quality, desktop-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Bug Sentinel
        run: |
          echo "Pipeline failed! Triggering Bug Sentinel for root cause analysis..."
          # Mock triggering the webhook. In production, use the real webhook URL.
          # curl -X POST -H "Content-Type: application/json" \
          #   -d '{"source": "github-actions", "symptom": "CI Pipeline failed on branch ${{ github.ref_name }}", "commit": "${{ github.sha }}"}' \
          #   ${{ secrets.SENTINEL_WEBHOOK_URL }} || echo "Sentinel hook skipped or unavailable"
