name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests
        working-directory: ./backend
        run: mvn test

  python-service-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./python-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        working-directory: ./python-service
        run: pytest



  sentinel-alert:
    needs: [backend-test, python-service-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Bug Sentinel
        run: |
          echo "Pipeline failed! Triggering Bug Sentinel for root cause analysis..."
          # Mock triggering the webhook. In production, use the real webhook URL.
          # curl -X POST -H "Content-Type: application/json" \
          #   -d '{"source": "github-actions", "symptom": "CI Pipeline failed on branch ${{ github.ref_name }}", "commit": "${{ github.sha }}"}' \
          #   ${{ secrets.SENTINEL_WEBHOOK_URL }} || echo "Sentinel hook skipped or unavailable"
