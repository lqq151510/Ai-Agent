name: Desktop Release Candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate tag, version, ancestry and Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            v*) ;;
            *)
              echo "::error::release tag must start with v: ${RELEASE_TAG}"
              exit 1
              ;;
          esac

          git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/main; then
            echo "::error::release tag ${RELEASE_TAG} is not reachable from origin/main"
            exit 1
          fi

          package_version="$(node -p "require('./desktop/package.json').version")"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "::error::tag ${RELEASE_TAG} must match desktop version v${package_version}"
            exit 1
          fi

          ./scripts/check-release-version.sh
          docker compose --env-file env/dev.env.example -f docker-compose.yml config --quiet

  build-macos-beta:
    name: Build macOS arm64 beta
    if: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-beta.') }}
    needs: validate-release
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/src/renderer-vue/package-lock.json
            ts-cli/package-lock.json
            local-service/package-lock.json

      - name: Build embedded backend and desktop
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          bash desktop/scripts/build-backend.sh
          npm ci --prefix desktop/src/renderer-vue --no-audit --no-fund
          npm ci --prefix desktop --no-audit --no-fund
          npm run build --prefix desktop
          (
            cd desktop
            npx electron-builder --mac --arm64 \
              --config electron-builder.yml \
              --config.mac.notarize=false
          )

      - name: Verify macOS beta artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg="desktop/release/AI Agent-${version}-mac-arm64.dmg"
          zip="desktop/release/AI Agent-${version}-mac-arm64.zip"
          app="desktop/release/mac-arm64/AI Agent.app"
          for artifact in "${dmg}" "${zip}"; do
            [[ -s "${artifact}" ]] || { echo "::error::missing artifact: ${artifact}"; exit 1; }
          done
          required=(
            "${app}/Contents/Resources/app.asar"
            "${app}/Contents/Resources/backend-jre/backend.jar"
            "${app}/Contents/Resources/backend-jre/jre/bin/java"
            "${app}/Contents/Resources/backend-jre/ts-cli/dist/index.js"
            "${app}/Contents/Resources/backend-jre/local-service/dist/index.js"
          )
          for file in "${required[@]}"; do
            [[ -f "${file}" ]] || { echo "::error::missing packaged file: ${file}"; exit 1; }
          done
          "${app}/Contents/Resources/backend-jre/jre/bin/java" -version
          hdiutil verify "${dmg}"

      - name: Archive macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-arm64-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*-mac-arm64.dmg
            desktop/release/*-mac-arm64.zip

  build-macos-formal:
    name: Build signed macOS arm64 release
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-beta.') }}
    needs: validate-release
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/src/renderer-vue/package-lock.json
            ts-cli/package-lock.json
            local-service/package-lock.json

      - name: Install desktop dependencies
        shell: bash
        run: |
          npm ci --prefix desktop --no-audit --no-fund
          npm ci --prefix desktop/src/renderer-vue --no-audit --no-fund
          npm ci --prefix ts-cli --no-audit --no-fund
          npm ci --prefix local-service --no-audit --no-fund

      - name: Run signed and notarized macOS release gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_CHECK_SKIP_COMPOSE_CONFIG: 'true'
          RELEASE_CHECK_DESKTOP_DISTRIBUTABLE: 'true'
          RELEASE_CHECK_PREPARE_DESKTOP_BACKEND: 'true'
          RELEASE_CHECK_REQUIRE_MAC_SIGNING: 'true'
          RELEASE_CHECK_REQUIRE_MAC_GATEKEEPER: 'true'
          RELEASE_CHECK_REQUIRE_CLEAN_SOURCE: 'true'
          RELEASE_CHECK_REQUIRE_VERSION_TAG: 'true'
          RELEASE_CHECK_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_CHECK_DESKTOP_DISTRIBUTION_TIMEOUT_SECONDS: '1800'
        run: ./scripts/release-check-macos.sh

      - name: Preserve macOS trust evidence for the cross-platform manifest
        shell: bash
        run: cp desktop/release/release-manifest.json desktop/release/macos-trust-evidence.json

      - name: Archive signed macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-arm64-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*-mac-arm64.dmg
            desktop/release/*-mac-arm64.zip
            desktop/release/macos-trust-evidence.json

  build-windows:
    name: Build Windows x64 installer
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/src/renderer-vue/package-lock.json
            ts-cli/package-lock.json
            local-service/package-lock.json

      - name: Build embedded backend and desktop
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          bash desktop/scripts/build-backend.sh
          npm ci --prefix desktop/src/renderer-vue --no-audit --no-fund
          npm ci --prefix desktop --no-audit --no-fund
          npm run build --prefix desktop
          (
            cd desktop
            npx electron-builder --win --x64 --config electron-builder.yml
          )

      - name: Verify Windows installer and embedded runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = "desktop/release/AI Agent-$version-win-x64.exe"
          $resources = 'desktop/release/win-unpacked/resources'
          $required = @(
            $installer,
            "$resources/app.asar",
            "$resources/backend-jre/backend.jar",
            "$resources/backend-jre/jre/bin/java.exe",
            "$resources/backend-jre/ts-cli/dist/index.js",
            "$resources/backend-jre/local-service/dist/index.js"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "missing packaged file: $file"
            }
          }
          if ((Get-Item -LiteralPath $installer).Length -le 0) {
            throw "empty Windows installer: $installer"
          }
          & "$resources/backend-jre/jre/bin/java.exe" -version
          if ($LASTEXITCODE -ne 0) {
            throw 'embedded Windows JRE failed to start'
          }

      - name: Archive Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x64-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 14
          path: desktop/release/*-win-x64.exe

  publish-release:
    name: Verify and publish desktop prerelease
    if: >-
      ${{ always()
          && needs.validate-release.result == 'success'
          && needs.build-windows.result == 'success'
          && (needs.build-macos-beta.result == 'success' || needs.build-macos-formal.result == 'success') }}
    needs:
      - validate-release
      - build-macos-beta
      - build-macos-formal
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*-${{ env.RELEASE_TAG }}
          path: desktop/release
          merge-multiple: true

      - name: Generate and verify release evidence
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for suffix in mac-arm64.dmg mac-arm64.zip win-x64.exe; do
            source="desktop/release/AI Agent-${version}-${suffix}"
            target="desktop/release/AI.Agent-${version}-${suffix}"
            [[ -f "${source}" ]] || { echo "::error::missing downloaded artifact: ${source}"; exit 1; }
            mv "${source}" "${target}"
          done
          expected=(
            "AI.Agent-${version}-mac-arm64.dmg"
            "AI.Agent-${version}-mac-arm64.zip"
            "AI.Agent-${version}-win-x64.exe"
          )
          for asset in "${expected[@]}"; do
            [[ -s "desktop/release/${asset}" ]] || { echo "::error::missing release asset: ${asset}"; exit 1; }
          done

          RELEASE_MANIFEST_MACOS_ARCH=arm64 ./scripts/release-manifest.sh desktop/release
          EXPECTED_COMMIT="$(git rev-parse HEAD)" RELEASE_TAG="${RELEASE_TAG}" node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'desktop/release/release-manifest.json';
          const evidencePath = 'desktop/release/macos-trust-evidence.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const isBeta = process.env.RELEASE_TAG.includes('-beta.');

          if (fs.existsSync(evidencePath)) {
            if (isBeta) throw new Error('beta release must not contain formal macOS trust evidence');
            const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
            if (evidence.git?.commit !== process.env.EXPECTED_COMMIT || evidence.git?.trackedDirty !== false) {
              throw new Error('macOS trust evidence does not match the release commit');
            }
            if (!Array.isArray(evidence.applications) || evidence.applications.length === 0) {
              throw new Error('formal macOS trust evidence has no application assessment');
            }
            for (const app of evidence.applications) {
              if (!app.codesign?.ok || !app.gatekeeper?.ok || !app.gatekeeper?.assessmentsEnabled) {
                throw new Error(`formal macOS trust assessment failed for ${app.path}`);
              }
            }
            manifest.applications = evidence.applications;
            manifest.platformTrust = {
              macos: {
                developerIdSigned: true,
                notarized: true,
                gatekeeperValidated: true,
              },
              windows: {
                authenticodeSigned: false,
              },
            };
          } else {
            if (!isBeta) throw new Error('formal release is missing macOS trust evidence');
            manifest.platformTrust = {
              macos: {
                developerIdSigned: false,
                notarized: false,
                gatekeeperValidated: false,
              },
              windows: {
                authenticodeSigned: false,
              },
            };
          }

          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          (
            cd desktop/release
            sha256sum -c SHA256SUMS
          )

          EXPECTED_COMMIT="$(git rev-parse HEAD)" RELEASE_TAG="${RELEASE_TAG}" node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('desktop/release/release-manifest.json', 'utf8'));
          const version = process.env.RELEASE_TAG.slice(1);
          const expected = [
            `AI.Agent-${version}-mac-arm64.dmg`,
            `AI.Agent-${version}-mac-arm64.zip`,
            `AI.Agent-${version}-win-x64.exe`,
          ].sort();
          const actual = manifest.artifacts.map((artifact) => artifact.fileName).sort();
          if (manifest.version !== version) throw new Error(`manifest version mismatch: ${manifest.version}`);
          if (manifest.git.commit !== process.env.EXPECTED_COMMIT) throw new Error('manifest commit does not match release tag');
          if (manifest.git.trackedDirty !== false) throw new Error('manifest reports tracked changes');
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`unexpected release assets: ${actual.join(', ')}`);
          }
          NODE

      - name: Create draft, re-download assets and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if release_output="$(gh release view "${RELEASE_TAG}" --json tagName 2>&1)"; then
            echo "${release_output}" >&2
            echo "::error::release already exists for ${RELEASE_TAG}; refusing to replace its assets"
            exit 1
          elif [[ "${release_output}" != *"release not found"* ]]; then
            echo "${release_output}" >&2
            echo "::error::could not determine whether release ${RELEASE_TAG} already exists"
            exit 1
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          if [[ "${RELEASE_TAG}" == *-beta.* ]]; then
            mac_note='macOS arm64 is an unsigned, unnotarized personal Beta; macOS may require explicit confirmation on first launch.'
          else
            mac_note='macOS arm64 passed Developer ID signing, notarization and Gatekeeper verification.'
          fi
          {
            echo '## Desktop installers'
            echo
            echo '- macOS arm64: DMG and ZIP'
            echo '- Windows x64: NSIS installer'
            echo
            echo "> ${mac_note}"
            echo '> The Windows installer is currently unsigned, so Microsoft Defender SmartScreen may show a warning.'
            echo
            echo "Verify downloaded binaries with \`SHA256SUMS\` before installation."
          } > "${notes}"

          assets=(desktop/release/*.dmg desktop/release/*.zip desktop/release/*.exe)
          gh release create "${RELEASE_TAG}" \
            "${assets[@]}" \
            desktop/release/release-manifest.json \
            desktop/release/SHA256SUMS \
            --verify-tag \
            --draft \
            --prerelease \
            --title "AI Agent ${RELEASE_TAG}" \
            --notes-file "${notes}"

          download_dir="$(mktemp -d)"
          gh release download "${RELEASE_TAG}" --dir "${download_dir}"
          (
            cd "${download_dir}"
            sha256sum -c SHA256SUMS
          )
          RELEASE_TAG="${RELEASE_TAG}" DOWNLOAD_DIR="${download_dir}" node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const dir = process.env.DOWNLOAD_DIR;
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'release-manifest.json'), 'utf8'));
          if (`v${manifest.version}` !== process.env.RELEASE_TAG) throw new Error('downloaded manifest version mismatch');
          for (const artifact of manifest.artifacts) {
            const bytes = fs.readFileSync(path.join(dir, artifact.fileName));
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== artifact.sha256) throw new Error(`downloaded hash mismatch: ${artifact.fileName}`);
          }
          NODE
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
