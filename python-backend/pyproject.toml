[project]
name = "knowledge-desk-backend"
version = "0.1.0"
description = "Knowledge Desk local backend (FastAPI) - personal-use knowledge workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "openai>=1.54.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    # Document parsing (PDF / DOCX / PPTX).
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
# MarkItDown is the declared fallback parser for formats without a dedicated
# native path. It is optional so the packaged runtime stays lean and the
# deterministic native parsers remain the primary path.
markitdown = ["markitdown[docx,pptx]>=0.1.0"]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pytest-cov>=6.0.0",
]
# Packaging toolchain for the macOS desktop runtime (see scripts/build-binary.sh).
build = ["pyinstaller>=6.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_desk"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Keep the temp workspace inside the project so the suite runs on machines where
# the system temp directory is sandboxed.
addopts = "-q --strict-markers --basetemp=.pytest-tmp"
filterwarnings = ["error::DeprecationWarning:knowledge_desk.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
