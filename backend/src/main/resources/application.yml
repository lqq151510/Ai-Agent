server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ai-agent-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  profiles:
    include: mq
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:ai_agent}}
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

security:
  jwt:
    secret: ${JWT_SECRET}
    access-exp-seconds: ${JWT_ACCESS_EXP_SECONDS:3600}
    refresh-exp-seconds: ${JWT_REFRESH_EXP_SECONDS:2592000}

app:
  workspace-root: ${WORKSPACE_ROOT:.}
  default-provider: ${MODEL_PROVIDER:VERTEXAI}
  default-openai-model: ${OPENAI_MODEL:deepseek/deepseek-chat}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  model-runtime:
    connect-timeout-ms: ${MODEL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MODEL_READ_TIMEOUT_MS:45000}
    total-timeout-ms: ${MODEL_TOTAL_TIMEOUT_MS:300000}
    idempotent-retries: ${MODEL_IDEMPOTENT_RETRIES:1}
  rate-limit:
    login-per-minute: ${LOGIN_RATE_LIMIT_PER_MIN:20}
    register-per-minute: ${REGISTER_RATE_LIMIT_PER_MIN:10}
    refresh-per-minute: ${REFRESH_RATE_LIMIT_PER_MIN:60}
    chat-per-minute: ${CHAT_RATE_LIMIT_PER_MIN:60}
    chat-premium-per-minute: ${CHAT_PREMIUM_RATE_LIMIT_PER_MIN:120}
    premium-email-suffixes: ${CHAT_PREMIUM_EMAIL_SUFFIXES:}
  startup-validation:
    fail-fast: ${STARTUP_VALIDATION_FAIL_FAST:true}
    model-probe-timeout-ms: ${MODEL_PROBE_TIMEOUT_MS:3000}
    model-probe-retries: ${MODEL_PROBE_RETRIES:1}
  openai:
    base-url: ${OPENAI_BASE_URL:http://localhost:1234/v1}
    api-key: ${OPENAI_API_KEY:sk-placeholder}

# Bug Sentinel 配置：全局异常自动上报到 webhook，默认开启
bug:
  sentinel:
    enabled: ${BUG_SENTINEL_ENABLED:true}
    environment: ${BUG_SENTINEL_ENV:dev}
    webhook:
      url: ${BUG_SENTINEL_WEBHOOK_URL:http://localhost:8080/api/v1/sentinel/report}

python-service:
  # python-service 文档解析服务基础地址
  base-url: ${PYTHON_SERVICE_BASE_URL:http://localhost:8000}
  # 连接超时（毫秒）
  connect-timeout-ms: ${PYTHON_SERVICE_CONNECT_TIMEOUT_MS:3000}
  # 读取超时（毫秒），文档解析可能较慢
  read-timeout-ms: ${PYTHON_SERVICE_READ_TIMEOUT_MS:30000}
  # 是否启用（不可用时降级到本地 MarkItDownService 逻辑）
  enabled: ${PYTHON_SERVICE_ENABLED:true}

mybatis-plus:
  type-handlers-package: com.agent.mvp.config
