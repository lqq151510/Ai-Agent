# E2E 测试专用配置：使用 H2 内存数据库，关闭外部依赖（Redis、Python 服务、模型探测）
# 通过 @ActiveProfiles({"test", "desktop"}) 激活，desktop profile 启用 Caffeine 替代 Redis 缓存
spring:
  datasource:
    url: jdbc:h2:mem:ai_agent_e2e;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/h2
    baseline-on-migrate: true
  cache:
    type: caffeine
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  h2:
    console:
      enabled: false

# MyBatis-Plus 配置：注册 UUID 类型处理器，H2 不原生支持 UUID 类型
mybatis-plus:
  type-handlers-package: com.agent.mvp.config
  configuration:
    # H2 在 PostgreSQL 模式下将 UUID 列报告为 OTHER 类型
    jdbc-type-for-null: OTHER

# JWT 密钥与数据库加密密钥（测试专用，满足 32 字符最小长度要求）
security:
  jwt:
    secret: e2e-test-secret-key-for-jwt-signing-must-be-long-enough
    access-exp-seconds: 3600
    refresh-exp-seconds: 2592000
  db:
    encryption-key: e2e-test-db-encryption-key-32-bytes!

# SandboxManager 通过 @Value("${WORKSPACE_ROOT:/app/workspace}") 读取此属性
WORKSPACE_ROOT: ${user.dir}

app:
  # 使用项目根目录作为 workspace，避免 CodeToolService 初始化失败
  workspace-root: ${user.dir}
  default-provider: OPENAI
  default-openai-model: mock-model
  cors:
    allowed-origins: http://localhost:5173
  model-runtime:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    total-timeout-ms: 10000
    idempotent-retries: 0
  # 速率限制调高，便于 E2E 测试连续调用
  rate-limit:
    login-per-minute: 1000
    register-per-minute: 1000
    refresh-per-minute: 1000
    chat-per-minute: 1000
    chat-premium-per-minute: 1000
    premium-email-suffixes: ""
  startup-validation:
    fail-fast: false
    model-probe-timeout-ms: 1000
    model-probe-retries: 0
  openai:
    base-url: http://localhost:0/v1
    api-key: sk-test-placeholder
  local-vector-store:
    # Desktop profile is active in the E2E tests; keep its durable index isolated from real user data.
    enabled: false
  desktop:
    cache:
      rate-limiter:
        idle-ttl-minutes: 2
        max-keys: 10000
      session:
        ttl-minutes: 5
        max-sessions: 1000

logging:
  level:
    root: WARN
    com.agent.mvp: INFO
    org.springframework.web: WARN
    org.hibernate: WARN

bug:
  sentinel:
    enabled: false
    max-request-bytes: 16384
