# Grafana 仪表盘自动加载配置
# 启动时从指定目录自动加载仪表盘 JSON 文件
apiVersion: 1

providers:
  - name: "AI Agent Dashboards"
    orgId: 1
    folder: "AI Agent"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
